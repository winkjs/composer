# composer/config/mosquitto.conf
#
# Reference Mosquitto configuration for composer deployments, and the
# config composer's integration tests (e2e-*.specs.js and the
# hardening tier) run against. The handbook walks every setting in
# plain words (docs/handbook/resilience.md, "Configuring the
# broker"); the one-line rationale stays here beside each value.
#
# References:
#   Mosquitto config docs — https://mosquitto.org/man/mosquitto-conf-5.html
#       (defaults and behavior verified against the man page 2026-07-18)
#   ADR-021 — composer keeps no disk buffer of its own for outgoing
#       messages, so the broker's persistence is the layer that keeps
#       queued messages alive.
#
# Settings rationale:
#
#   listener 1883
#       Standard MQTT port. Same as default; declared explicitly so the
#       intent is visible.
#
#   allow_anonymous true
#       Test environment only. Production should use authentication.
#
#   max_queued_messages 0
#       Unlimited per-client queue (default 1000). Without this,
#       Mosquitto silently drops messages beyond 1000 when a subscriber
#       can't keep up — exactly the failure mode a 100 k-message burst
#       test surfaced (only ~1040 of 100 000 reached the subscriber).
#       Production deployments size this for the worst-case burst the
#       slowest consumer might face.
#
#   max_inflight_messages 1000
#       Per-client QoS 1 / QoS 2 in-flight cap (default 20). 20 is too
#       tight for high-rate publishers and high-rate subscribers alike;
#       1000 gives plenty of headroom while still bounding memory.
#
#   persistence true
#       Save sessions, subscriptions, and queued messages to disk so
#       they survive a broker restart. Until 2026-07-18 this was false,
#       justified by a composer-side disk buffer (LevelDB) that ADR-021
#       has since removed. With that buffer gone, broker persistence is
#       what keeps a stopped composer's queued input alive.
#
#   persistence_location /mosquitto/data/
#       Where mosquitto.db lives. This is the standard data path inside
#       the eclipse-mosquitto container, mounted as a named volume in
#       docker-compose.yml: `docker compose down` keeps the data,
#       `docker compose down -v` wipes it.
#
#   autosave_interval 60
#       Save the in-memory database to disk every 60 seconds (default
#       1800 = 30 minutes). Persistence is a periodic save, not a
#       per-message write: a broker crash or power cut loses whatever
#       changed since the last save. 60 seconds makes that window one
#       minute instead of half an hour. A clean shutdown or restart
#       always saves on exit, regardless of this interval.
#
#   persistent_client_expiration 14d
#       Forget a persistent session whose client never returns, after
#       14 days. Composer's own sessions expire after 7 days
#       (MQTT_SESSION_EXPIRY_S); this broker-side backstop is twice
#       that, so the broker is always the last to forget — it only
#       cleans up sessions composer has already abandoned. Without it,
#       dead deployments accumulate queues without bound.

listener 1883
allow_anonymous true

max_queued_messages 0
max_inflight_messages 1000

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
persistent_client_expiration 14d
