# Bug report form. It appears in the issue chooser at
# https://github.com/winkjs/composer/issues/new/choose.
#
# Every field exists to make the report runnable. A report we can
# reproduce gets fixed quickly; one we cannot usually stalls
# (CONTRIBUTING.md, "Two things every report needs").
name: Bug report
description: winkComposer behaves differently from what its documentation says.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in every field you can. A report we can run gets fixed quickly.

        **Suspected security vulnerability?** Do not file it here. Use the private [Report a vulnerability](https://github.com/winkjs/composer/security/advisories/new) form instead.
  - type: input
    id: version
    attributes:
      label: winkComposer version
      description: Output of `npm ls @winkjs/composer`.
      placeholder: "@winkjs/composer@0.6.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.16.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Name and version. Say if it runs on a Raspberry Pi or another edge device.
      placeholder: Raspberry Pi OS 12 (64-bit)
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: Minimal flow
      description: The smallest flow that shows the problem. Start from `examples/hello-flow` and trim it to the failing node.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input that triggers it
      description: The messages or CSV rows the flow was fed. A few rows are usually enough.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the exact output or error text, including any `winkComposer/...` log line.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: human
    attributes:
      label: Confirmation
      description: Tools, including AI assistants, are welcome in your workflow. A report no person can explain is closed.
      options:
        - label: I understand this report and can answer questions about it.
          required: true
